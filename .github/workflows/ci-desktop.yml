# PHASE-021 — desktop release engineering (Windows-only this phase).
# Runs on windows-latest: builds the Tauri shell around the static web export,
# signs the NSIS installer AND the updater bundle with store-backed keys
# (SECRETS_MANAGEMENT §3 S-15 — signing NEVER on developer machines), emits an
# SBOM (CycloneDX), scans for secrets (gitleaks), and uploads artifacts.
# The chaos desktop profile and Playwright offline smoke run in ci.yml on the
# same trigger and stay blocking.
name: CI — Desktop release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-release:
    runs-on: windows-latest
    permissions:
      contents: write # release upload
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-rust@v1
        with:
          components: rustfmt, clippy

      # CalVer: derive YYYY.MM.PATCH from the tag or date (RELEASE_STRATEGY)
      - name: Resolve CalVer
        id: ver
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -match 'v(\d+\.\d+\.\d+)') { $Matches[1] } else { (Get-Date -Format 'yyyy.M').ToString() + '.0' }
          echo "version=$tag" >> $env:GITHUB_OUTPUT

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: sync-core + desktop unit tests
        run: |
          pnpm --filter @erp/sync-core test
          pnpm --filter @erp/desktop test

      - name: Web static-export guard + build (Tauri target)
        working-directory: apps/web
        run: |
          pnpm check:tauri-export
          pnpm build:tauri

      - name: Build Tauri shell (unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build -- --config tauri.conf.ci.json

      - name: SBOM (CycloneDX)
        uses: CycloneDX/cyclonedx-action@v1
        with:
          outputFormat: json
          outputFile: sbom.json

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2

      - name: Sign NSIS installer (store-backed key, CI-only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: signpath/signpath-action@v1
        with:
          artifact: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          signtool-args: /fd sha256 /tr http://timestamp.digicert.com

      - name: Sign updater bundle + publish staged manifest (10% first stage)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.TAURI_UPDATER_SIGNING_KEY }}
        run: |
          pnpm tauri signer sign -m $env:UPDATER_SIGNING_KEY -o updater-manifest.json .
          # staged rollout: first stage 10% (updater.ts ROLLOUT_STAGES), crash
          # gates read the client-stability dashboard before 50/100 (D-06)
          echo "staged rollout stage=10% channel=stable"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ steps.ver.outputs.version }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            updater-manifest.json
            sbom.json

      - name: Create GitHub release (signed assets)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            updater-manifest.json
            sbom.json
