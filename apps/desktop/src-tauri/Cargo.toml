[package]
name = "erp-desktop"
version = "2026.11.0"
description = "PHASE-021 Tauri v2 Windows shell for the offline web-ERP (ADR-0013)"
edition = "2021"

[lib]
name = "erp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-keyring = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher: the SQL plugin opens erp_local.db with the key read from the
# OS keychain at startup (D-02/D-04); the key itself never touches disk.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_UI_Shell"] }
